name: Deploy to Hostinger

# Runs whenever main changes, e.g. when a new issue is added to content/issues/.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      # Hostinger uses port 65002 for SSH.
      SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
      # Folder for thesixfigureslp.com/insider, relative to the Hostinger home folder.
      TARGET_DIR: ${{ vars.SSH_TARGET_DIR || 'domains/thesixfigureslp.com/public_html/insider' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so we can see which issues this push added or changed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Email GIF: each issue scrolling inside a phone, served at /insider/email/<issue>.gif.
      # Made for issues this push added or changed (all issues on a manual run).
      # If this fails, the site still deploys.
      - name: Make email GIFs
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            slugs=$(git diff --no-renames --name-only --diff-filter=AM "$BEFORE" HEAD -- content/issues | grep '\.md$' | xargs -r -n1 basename | sed 's/\.md$//')
          else
            slugs=$(ls content/issues | grep '\.md$' | sed 's/\.md$//')
          fi
          if [ -z "$slugs" ]; then echo "No new or changed issues."; exit 0; fi
          echo "Making GIFs for: $slugs"
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:4321/insider/ > /dev/null && break; sleep 1; done
          node email-gif/capture.mjs http://localhost:4321/insider /tmp/captures $slugs
          python3 email-gif/make_gif.py /tmp/captures dist/email $slugs

      - name: Check Hostinger SSH details are set
        id: ssh
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USERNAME" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The site built, but it was not uploaded: add SSH_HOST, SSH_USERNAME and SSH_PRIVATE_KEY under Settings > Secrets and variables > Actions."
          fi

      - name: Upload to Hostinger
        if: steps.ssh.outputs.ready == 'true'
        run: |
          # The upload deletes files in the target folder that aren't in the build,
          # so refuse anything that could be the main website's folder.
          case "${TARGET_DIR%/}" in
            ""|*public_html|/*) echo "::error::SSH_TARGET_DIR must be a subfolder of public_html, e.g. domains/thesixfigureslp.com/public_html/insider"; exit 1 ;;
          esac

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2> ~/keycheck.txt; then
            # Describe the key's shape without printing any of it.
            echo "Key check: $(wc -l < ~/.ssh/deploy_key) lines;" \
              "starts with BEGIN line: $(head -1 ~/.ssh/deploy_key | grep -q '^-----BEGIN' && echo yes || echo no);" \
              "ends with END line: $(grep -v '^$' ~/.ssh/deploy_key | tail -1 | grep -q '^-----END' && echo yes || echo no);" \
              "PuTTY format: $(grep -q '^PuTTY-User-Key-File' ~/.ssh/deploy_key && echo yes || echo no)"
            echo "ssh-keygen said: $(cat ~/keycheck.txt)"
            if grep -qi 'passphrase' ~/keycheck.txt; then
              echo "::error::This key is protected by a password. Make a new key with an empty password (-N \"\") and update both Hostinger and SSH_PRIVATE_KEY."
            elif grep -q '^ssh-' ~/.ssh/deploy_key; then
              echo "::error::SSH_PRIVATE_KEY holds the public key (insider_deploy.pub). Paste the private key file (insider_deploy) instead."
            else
              echo "::error::SSH_PRIVATE_KEY isn't a readable private key. Paste the whole insider_deploy file, from the -----BEGIN line to the -----END line."
            fi
            exit 1
          fi
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT"

          $SSH "$SSH_USERNAME@$SSH_HOST" "mkdir -p '${TARGET_DIR%/}'"
          # GIFs are only made for new or changed issues, so never delete old ones.
          rsync -rlz --delete --exclude='.well-known' --exclude='email/' -e "$SSH" dist/ "$SSH_USERNAME@$SSH_HOST:${TARGET_DIR%/}/"
          if [ -d dist/email ]; then
            $SSH "$SSH_USERNAME@$SSH_HOST" "mkdir -p '${TARGET_DIR%/}/email'"
            rsync -rlz -e "$SSH" dist/email/ "$SSH_USERNAME@$SSH_HOST:${TARGET_DIR%/}/email/"
          fi
          echo "Uploaded to https://thesixfigureslp.com/insider/"
